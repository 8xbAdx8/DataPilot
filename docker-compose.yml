services:
  postgres:
    build:
      context: ./infra
      dockerfile: Dockerfile.postgres
    image: datapilot-postgres-vector:0.8.7-pg17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapilot_local}
      POSTGRES_DB: ${POSTGRES_DB:-datapilot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    build: ./backend
    image: datapilot-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-datapilot}:${POSTGRES_PASSWORD:-datapilot_local}@postgres:5432/${POSTGRES_DB:-datapilot}
      DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  backend:
    build: ./backend
    image: datapilot-backend:local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-datapilot}:${POSTGRES_PASSWORD:-datapilot_local}@postgres:5432/${POSTGRES_DB:-datapilot}
      DATA_DIR: /data
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    volumes:
      - analytics_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  postgres_data:
  analytics_data:
