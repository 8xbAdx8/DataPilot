[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot-backend"
version = "0.1.0"
description = "Guarded natural language data analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1", "duckdb>=1.4,<2",
  "pandas>=2.2,<4", "openpyxl>=3.1.5,<4",
  "sqlglot>=27,<31", "httpx>=0.28,<1",
  "langgraph>=1.2.16,<1.3", "langchain>=1.4.6,<1.5",
  "langchain-openai>=1.7.2,<1.8", "langsmith>=0.14.11,<0.15",
  "pgvector>=0.5.1,<0.6", "websockets>=15,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["evals/*.json", "evals/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a real PostgreSQL connection", "live_llm: requires explicit real API configuration"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
